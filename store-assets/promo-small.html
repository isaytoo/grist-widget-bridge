<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Grist Widget Bridge — Small tile 440×280</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 440px; height: 280px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; position: relative;
      color: #fff;
      display: flex; flex-direction: column; justify-content: center;
      padding: 28px 32px;
    }

    .bg-circle {
      position: absolute; border-radius: 50%; opacity: .15; filter: blur(2px);
    }
    .bg-1 { width: 280px; height: 280px; background: #16b378; top: -110px; right: -90px; }
    .bg-2 { width: 200px; height: 200px; background: #f97316; bottom: -90px; left: -70px; }

    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; z-index: 1; }
    .logo {
      width: 44px; height: 44px;
      background: #16b378; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 22px;
      box-shadow: 0 6px 20px rgba(22,179,120,.4);
    }
    .brand { font-size: 18px; font-weight: 700; }

    h1 {
      font-size: 28px; font-weight: 800; line-height: 1.1;
      margin-bottom: 12px; position: relative; z-index: 1;
    }
    .accent {
      background: linear-gradient(135deg, #16b378, #4ade80);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .tagline {
      font-size: 13px; color: #cbd5e1; line-height: 1.4;
      margin-bottom: 14px; position: relative; z-index: 1;
    }

    .pills { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; }
    .pill {
      font-size: 11px; padding: 5px 11px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px; color: #fff;
    }
    .pill.grist  { background: rgba(22,179,120,.15);  border-color: rgba(22,179,120,.35);  color: #4ade80; }
    .pill.widget { background: rgba(249,115,22,.15);  border-color: rgba(249,115,22,.35);  color: #fb923c; }
  </style>
</head>
<body>
  <div class="bg-circle bg-1"></div>
  <div class="bg-circle bg-2"></div>

  <div class="logo-row">
    <div class="logo">G</div>
    <div class="brand">Grist Widget Bridge</div>
  </div>

  <h1>Débloquez vos <span class="accent">widgets Grist</span></h1>
  <div class="tagline">CORS, localStorage et upload — sur n'importe quelle instance.</div>

  <div class="pills">
    <div class="pill grist">Multi-instances</div>
    <div class="pill widget">Multi-widgets</div>
    <div class="pill">Aucun code à toucher</div>
  </div>
</body>
</html>
